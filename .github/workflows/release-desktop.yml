name: Build & Release Desktop (Linux & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag version (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"
      web_url:
        description: "Production Web URL (e.g. https://kshare.example.com)"
        required: false
        default: "http://localhost:3000"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage & deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Linux packages
        run: pnpm desktop:dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KSHARE_WEB_URL: ${{ github.event.inputs.web_url || vars.KSHARE_WEB_URL || 'http://localhost:3000' }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kshare-linux-installers
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.tar.gz

  build-windows:
    name: Build Windows (NSIS .exe & Portable .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows packages
        run: pnpm desktop:dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KSHARE_WEB_URL: ${{ github.event.inputs.web_url || vars.KSHARE_WEB_URL || 'http://localhost:3000' }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kshare-windows-installers
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*-win.zip

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag_name=${{ github.event.inputs.tag_name || 'v1.0.0' }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "KShare Desktop ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*.AppImage
            release-assets/*.tar.gz
            release-assets/*.exe
            release-assets/*-win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
